<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E7DEB"/>
      <stop offset="100%" stop-color="#5456B9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7ccf7" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- stylized open book -->
  <g transform="translate(5, 6)">
    <!-- left page -->
    <path d="M11 3 C11 3 7 3.5 3 6 L3 20 C6.5 18 10 17.5 11 17.5 L11 3 Z" fill="white" opacity="0.95"/>
    <!-- right page -->
    <path d="M11 3 C11 3 15 3.5 19 6 L19 20 C15.5 18 12 17.5 11 17.5 L11 3 Z" fill="white" opacity="0.75"/>
    <!-- spine line -->
    <line x1="11" y1="3" x2="11" y2="17.5" stroke="#8892e8" stroke-width="0.8"/>
    <!-- color accent dots (chroma) -->
    <circle cx="7" cy="9" r="1" fill="#a5b0f5" opacity="0.8"/>
    <circle cx="7" cy="12" r="1" fill="#7de8c8" opacity="0.8"/>
    <circle cx="7" cy="15" r="1" fill="#f0a5c0" opacity="0.8"/>
  </g>
</svg>
